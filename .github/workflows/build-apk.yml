name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Prepare resources layout
        run: |
          mkdir -p res/values res/xml res/drawable
          [ -f file_paths.xml ] && cp file_paths.xml res/xml/
          [ -f backup_rules.xml ] && cp backup_rules.xml res/xml/
          [ -f data_extraction_rules.xml ] && cp data_extraction_rules.xml res/xml/
          [ -f colors.xml ] && cp colors.xml res/values/
          cat << 'EOF' > res/values/strings.xml
          <resources>
              <string name="app_name">WChat</string>
          </resources>
          EOF
          cat << 'EOF' > res/values/themes.xml
          <resources>
              <style name="Theme.WChat" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
